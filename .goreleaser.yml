before:
  hooks:
    - go mod download

builds:
  - binary: posh
    main: ./cmd/sqlc/main.go
    env:
      - CGO_ENABLED=0
    flags:
      - -tags=safe
    ldflags:
      - -s -w
      - -X github.com/sqlc-dev/sqlc/internal/cmd.version={{.Version}}
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

changelog:
  use: github-native
